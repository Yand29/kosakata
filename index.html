<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Kosakata & Kana Jepang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .font-jp {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🇯🇵</span>
                <h1 class="font-bold text-lg text-slate-900 tracking-tight">NihongoMaster</h1>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center gap-6 bg-slate-100 px-4 py-1.5 rounded-full text-sm font-semibold text-slate-600">
                <div>Score: <span id="stat-score" class="text-emerald-600 font-bold">0</span></div>
                <div class="h-4 w-[1px] bg-slate-300"></div>
                <div>Round: <span id="stat-round" class="text-indigo-600 font-bold">1</span></div>
                <div class="h-4 w-[1px] bg-slate-300"></div>
                <div>Akurasi: <span id="stat-accuracy" class="text-slate-800 font-bold">100%</span></div>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full flex flex-col items-center">

        <!-- Category Selector -->
        <div class="w-full max-w-2xl mb-8">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">Pilih Kategori Belajar</label>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 bg-slate-200 p-1.5 rounded-2xl">
                <button onclick="changeCategory('hiragana')" id="cat-hiragana" class="cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Hiragana</button>
                <button onclick="changeCategory('katakana')" id="cat-katakana" class="cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Katakana</button>
                <button onclick="changeCategory('n5')" id="cat-n5" class="cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Kanji N5</button>
                <button onclick="changeCategory('n4')" id="cat-n4" class="cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Kanji N4</button>
                <button onclick="changeCategory('n3')" id="cat-n3" class="cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900">Kanji N3</button>
            </div>
        </div>

        <!-- Instructions / Info Header -->
        <div class="text-center mb-6">
            <h2 id="category-title" class="text-2xl font-extrabold text-slate-900">Hiragana Lengkap</h2>
            <p id="category-desc" class="text-sm text-slate-500 mt-1">Selesaikan 3 kartu di bawah ini untuk lanjut ke ronde berikutnya!</p>
        </div>

        <!-- 3 Cards Grid (Inline / Tanpa Popup) -->
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full mb-8">
            <!-- Cards will be injected by JS -->
        </div>

        <!-- Next Round Button -->
        <div class="text-center">
            <button id="next-round-btn" onclick="nextRound()" disabled class="px-8 py-3.5 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none transition-all duration-200 transform active:scale-95">
                Ronde Berikutnya ➔
            </button>
        </div>

    </main>

    <script>
        // Data Kana & Kanji
        const DATABASE = {
            hiragana: [
                { q: "あ", a: "a" }, { q: "い", a: "i" }, { q: "う", a: "u" }, { q: "え", a: "e" }, { q: "お", a: "o" },
                { q: "か", a: "ka" }, { q: "き", a: "ki" }, { q: "く", a: "ku" }, { q: "け", a: "ke" }, { q: "こ", a: "ko" },
                { q: "さ", a: "sa" }, { q: "し", a: "shi" }, { q: "す", a: "su" }, { q: "せ", a: "se" }, { q: "そ", a: "so" },
                { q: "た", a: "ta" }, { q: "ち", a: "chi" }, { q: "つ", a: "tsu" }, { q: "て", a: "te" }, { q: "と", a: "to" },
                { q: "な", a: "na" }, { q: "に", a: "ni" }, { q: "ぬ", a: "nu" }, { q: "ね", a: "ne" }, { q: "の", a: "no" },
                { q: "は", a: "ha" }, { q: "ひ", a: "hi" }, { q: "ふ", a: "fu" }, { q: "へ", a: "he" }, { q: "ほ", a: "ho" },
                { q: "ま", a: "ma" }, { q: "み", a: "mi" }, { q: "む", a: "mu" }, { q: "め", a: "me" }, { q: "も", a: "mo" },
                { q: "や", a: "ya" }, { q: "ゆ", a: "yu" }, { q: "よ", a: "yo" },
                { q: "ら", a: "ra" }, { q: "り", a: "ri" }, { q: "る", a: "ru" }, { q: "れ", a: "re" }, { q: "ろ", a: "ro" },
                { q: "わ", a: "wa" }, { q: "を", a: "wo" }, { q: "ん", a: "n" },
                { q: "が", a: "ga" }, { q: "ぎ", a: "gi" }, { q: "ぐ", a: "gu" }, { q: "げ", a: "ge" }, { q: "ご", a: "go" },
                { q: "ざ", a: "za" }, { q: "じ", a: "ji" }, { q: "ず", a: "zu" }, { q: "ぜ", a: "ze" }, { q: "ぞ", a: "zo" },
                { q: "だ", a: "da" }, { q: "ぢ", a: "ji" }, { q: "づ", a: "zu" }, { q: "で", a: "de" }, { q: "ど", a: "do" },
                { q: "ば", a: "ba" }, { q: "び", a: "bi" }, { q: "ぶ", a: "bu" }, { q: "べ", a: "be" }, { q: "ぼ", a: "bo" },
                { q: "ぱ", a: "pa" }, { q: "ぴ", a: "pi" }, { q: "ぷ", a: "pu" }, { q: "ぺ", a: "pe" }, { q: "ぽ", a: "po" },
                { q: "きゃ", a: "kya" }, { q: "きゅ", a: "kyu" }, { q: "きょ", a: "kyo" },
                { q: "しゃ", a: "sha" }, { q: "しゅ", a: "shu" }, { q: "しょ", a: "sho" },
                { q: "ちゃ", a: "cha" }, { q: "ちゅ", a: "chu" }, { q: "ちょ", a: "cho" },
                { q: "にゃ", a: "nya" }, { q: "にゅ", a: "nyu" }, { q: "にょ", a: "nyo" },
                { q: "ひゃ", a: "hya" }, { q: "ひゅ", a: "hyu" }, { q: "ひょ", a: "hyo" },
                { q: "みゃ", a: "mya" }, { q: "みゅ", a: "myu" }, { q: "みょ", a: "myo" },
                { q: "りゃ", a: "rya" }, { q: "りゅ", a: "ryu" }, { q: "りょ", a: "ryo" }
            ],
            katakana: [
                { q: "ア", a: "a" }, { q: "イ", a: "i" }, { q: "ウ", a: "u" }, { q: "エ", a: "e" }, { q: "オ", a: "o" },
                { q: "カ", a: "ka" }, { q: "キ", a: "ki" }, { q: "ク", a: "ku" }, { q: "ケ", a: "ke" }, { q: "コ", a: "ko" },
                { q: "サ", a: "sa" }, { q: "シ", a: "shi" }, { q: "ス", a: "su" }, { q: "セ", a: "se" }, { q: "ソ", a: "so" },
                { q: "タ", a: "ta" }, { q: "チ", a: "chi" }, { q: "ツ", a: "tsu" }, { q: "テ", a: "te" }, { q: "ト", a: "to" },
                { q: "ナ", a: "na" }, { q: "ニ", a: "ni" }, { q: "ヌ", a: "nu" }, { q: "ネ", a: "ne" }, { q: "ノ", a: "no" },
                { q: "ハ", a: "ha" }, { q: "ヒ", a: "hi" }, { q: "フ", a: "fu" }, { q: "ヘ", a: "he" }, { q: "ホ", a: "ho" },
                { q: "マ", a: "ma" }, { q: "ミ", a: "mi" }, { q: "ム", a: "mu" }, { q: "メ", a: "me" }, { q: "モ", a: "mo" },
                { q: "ヤ", a: "ya" }, { q: "ユ", a: "yu" }, { q: "ヨ", a: "yo" },
                { q: "ラ", a: "ra" }, { q: "リ", a: "ri" }, { q: "ル", a: "ru" }, { q: "レ", a: "re" }, { q: "ロ", a: "ro" },
                { q: "ワ", a: "wa" }, { q: "ヲ", a: "wo" }, { q: "ン", a: "n" },
                { q: "ガ", a: "ga" }, { q: "ギ", a: "gi" }, { q: "グ", a: "gu" }, { q: "ゲ", a: "ge" }, { q: "ゴ", a: "go" },
                { q: "ザ", a: "za" }, { q: "ジ", a: "ji" }, { q: "ズ", a: "zu" }, { q: "ゼ", a: "ze" }, { q: "ゾ", a: "zo" },
                { q: "ダ", a: "da" }, { q: "ヂ", a: "ji" }, { q: "ヅ", a: "zu" }, { q: "デ", a: "de" }, { q: "ド", a: "do" },
                { q: "バ", a: "ba" }, { q: "ビ", a: "bi" }, { q: "ブ", a: "bu" }, { q: "ベ", a: "be" }, { q: "ボ", a: "bo" },
                { q: "パ", a: "pa" }, { q: "ピ", a: "pi" }, { q: "プ", a: "pu" }, { q: "ペ", a: "pe" }, { q: "ポ", a: "po" },
                { q: "キャ", a: "kya" }, { q: "キュ", a: "kyu" }, { q: "キョ", a: "kyo" },
                { q: "シャ", a: "sha" }, { q: "シュ", a: "shu" }, { q: "ショ", a: "sho" },
                { q: "チャ", a: "cha" }, { q: "チュ", a: "chu" }, { q: "チョ", a: "cho" }
            ],
            n5: [
                { q: "日", r: "hi / nichi", a: "Hari / Matahari" },
                { q: "本", r: "hon", a: "Buku / Asal" },
                { q: "人", r: "hito / jin", a: "Orang" },
                { q: "月", r: "tsuki / getsu", a: "Bulan" },
                { q: "火", r: "hi / ka", a: "Api" },
                { q: "水", r: "mizu / sui", a: "Air" },
                { q: "木", r: "ki / moku", a: "Pohon / Kayu" },
                { q: "金", r: "kane / kin", a: "Uang / Emas" },
                { q: "土", r: "tsuchi / do", a: "Tanah" },
                { q: "山", r: "yama", a: "Gunung" },
                { q: "川", r: "kawa", a: "Sungai" },
                { q: "田", r: "ta", a: "Sawah" }
            ],
            n4: [
                { q: "犬", r: "inu", a: "Anjing" },
                { q: "猫", r: "neko", a: "Kucing" },
                { q: "青", r: "ao", a: "Biru" },
                { q: "赤", r: "aka", a: "Merah" },
                { q: "黒", r: "kuro", a: "Hitam" },
                { q: "白", r: "shiro", a: "Putih" },
                { q: "春", r: "haru", a: "Musim Semi" },
                { q: "夏", r: "natsu", a: "Musim Panas" },
                { q: "秋", r: "aki", a: "Musim Gugur" },
                { q: "冬", r: "fuyu", a: "Musim Dingin" }
            ],
            n3: [
                { q: "政", a: "Politik / Pemerintahan" },
                { q: "議", a: "Musyawarah / Diskusi" },
                { q: "連", a: "Hubungan / Hubung" },
                { q: "対", a: "Lawan / Hadap" },
                { q: "部", a: "Bagian / Klub" },
                { q: "合", a: "Cocok / Gabung" },
                { q: "市", a: "Kota / Pasar" },
                { q: "内", a: "Dalam" },
                { q: "相", a: "Saling / Muka" },
                { q: "定", a: "Pasti / Tetap" }
            ]
        };

        const CATEGORY_NAMES = {
            hiragana: { title: "Hiragana Lengkap", desc: "Tebak lafal romaji dari huruf Hiragana berikut!" },
            katakana: { title: "Katakana Lengkap", desc: "Tebak lafal romaji dari huruf Katakana berikut!" },
            n5: { title: "Kanji N5 (dengan Romaji)", desc: "Pilih arti bahasa Indonesia dari Kanji N5!" },
            n4: { title: "Kanji N4 (Romaji Acak)", desc: "Pilih arti bahasa Indonesia dari Kanji N4!" },
            n3: { title: "Kanji N3 (Tanpa Romaji)", desc: "Pilih arti bahasa Indonesia dari Kanji N3!" }
        };

        let currentCategory = 'hiragana';
        let roundScore = 0;
        let totalAnswered = 0;
        let totalCorrect = 0;
        let roundNumber = 1;
        let currentRoundQuestions = [];
        let answeredCardsCount = 0;

        function changeCategory(cat) {
            currentCategory = cat;
            
            // Update active button style
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            activeBtn.className = "cat-btn py-2 px-3 rounded-xl font-bold text-xs sm:text-sm transition-all duration-200 bg-white text-indigo-600 shadow-sm";

            // Update Titles
            document.getElementById('category-title').textContent = CATEGORY_NAMES[cat].title;
            document.getElementById('category-desc').textContent = CATEGORY_NAMES[cat].desc;

            startRound();
        }

        function getRandomItems(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function generateDistractors(correctAnswer, fullList, count = 3) {
            const isKana = currentCategory === 'hiragana' || currentCategory === 'katakana';
            const key = isKana ? 'a' : 'a';
            
            const distractors = fullList
                .map(item => item[key])
                .filter(val => val !== correctAnswer);
            
            const uniqueDistractors = [...new Set(distractors)];
            const selected = getRandomItems(uniqueDistractors, count);
            
            return [...selected, correctAnswer].sort(() => 0.5 - Math.random());
        }

        function startRound() {
            answeredCardsCount = 0;
            document.getElementById('next-round-btn').disabled = true;

            const pool = DATABASE[currentCategory];
            const selectedQuestions = getRandomItems(pool, 3);

            currentRoundQuestions = selectedQuestions.map(q => {
                const options = generateDistractors(
                    (currentCategory === 'hiragana' || currentCategory === 'katakana') ? q.a : q.a,
                    pool
                );

                // Show Romaji Logic
                let showRomaji = false;
                if (currentCategory === 'n5') showRomaji = true;
                if (currentCategory === 'n4') showRomaji = Math.random() < 0.5;

                return {
                    ...q,
                    options: options,
                    showRomaji: showRomaji,
                    answered: false
                };
            });

            renderCards();
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            currentRoundQuestions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between items-center text-center transition-all duration-300";
                card.id = `card-${idx}`;

                let romajiHTML = '';
                if (q.showRomaji && q.r) {
                    romajiHTML = `<span class="text-xs font-semibold text-slate-400 mt-1">[ ${q.r} ]</span>`;
                }

                let optionsHTML = q.options.map(opt => {
                    return `
                        <button onclick="handleAnswer(${idx}, '${opt}')" class="opt-btn-${idx} w-full py-2.5 px-3 bg-slate-50 hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold text-sm rounded-xl transition-all duration-150">
                            ${opt}
                        </button>
                    `;
                }).join('');

                card.innerHTML = `
                    <div class="w-full flex items-center justify-between text-xs font-bold text-slate-400 mb-2">
                        <span>KARTU #${idx + 1}</span>
                        <span id="status-${idx}" class="text-slate-400">Belum Dijawab</span>
                    </div>

                    <!-- Question Block -->
                    <div class="my-4 flex flex-col items-center">
                        <span class="font-jp text-5xl font-extrabold text-slate-900">${q.q}</span>
                        ${romajiHTML}
                    </div>

                    <!-- Options Grid -->
                    <div class="w-full grid grid-cols-1 gap-2 mt-2" id="options-${idx}">
                        ${optionsHTML}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function handleAnswer(cardIdx, selectedAnswer) {
            const q = currentRoundQuestions[cardIdx];
            if (q.answered) return;

            q.answered = true;
            answeredCardsCount++;
            totalAnswered++;

            const correctAnswer = (currentCategory === 'hiragana' || currentCategory === 'katakana') ? q.a : q.a;
            const isCorrect = selectedAnswer === correctAnswer;

            const card = document.getElementById(`card-${cardIdx}`);
            const statusTag = document.getElementById(`status-${cardIdx}`);
            const optionBtns = document.querySelectorAll(`.opt-btn-${cardIdx}`);

            if (isCorrect) {
                totalCorrect++;
                roundScore += 10;
                statusTag.textContent = "Benar! ✓";
                statusTag.className = "text-emerald-600 font-bold";
                card.classList.add('border-emerald-300', 'bg-emerald-50/20');
            } else {
                statusTag.textContent = "Salah ✗";
                statusTag.className = "text-rose-600 font-bold";
                card.classList.add('border-rose-300', 'bg-rose-50/20');
            }

            optionBtns.forEach(btn => {
                btn.disabled = true;
                const btnText = btn.textContent.trim();

                if (btnText === correctAnswer) {
                    btn.className = "w-full py-2.5 px-3 bg-emerald-500 border border-emerald-600 text-white font-bold text-sm rounded-xl";
                } else if (btnText === selectedAnswer && !isCorrect) {
                    btn.className = "w-full py-2.5 px-3 bg-rose-500 border border-rose-600 text-white font-bold text-sm rounded-xl";
                } else {
                    btn.className = "w-full py-2.5 px-3 bg-slate-100 opacity-50 border border-slate-200 text-slate-400 font-bold text-sm rounded-xl cursor-not-allowed";
                }
            });

            updateStats();

            // Enable Next Round button if all 3 cards are answered
            if (answeredCardsCount === 3) {
                document.getElementById('next-round-btn').disabled = false;
            }
        }

        function updateStats() {
            document.getElementById('stat-score').textContent = roundScore;
            document.getElementById('stat-round').textContent = roundNumber;
            
            const accuracy = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 100;
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
        }

        function nextRound() {
            roundNumber++;
            updateStats();
            startRound();
        }

        // Init
        changeCategory('hiragana');
    </script>
</body>
</html>
